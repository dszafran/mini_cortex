[project]
name = "mini-cortex"
version = "0.1.0"
description = "mini-cortex: connector hub, memory pipeline, API and prebuilt UI in one app."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "certifi",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "lancedb>=0.40.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
mini-cortex = "mini_cortex.server:main"
doctor = "mini_cortex.doctor:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
